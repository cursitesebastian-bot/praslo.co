<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <META NAME="viewport" CONTENT="width=device-width, initial-scale=1.0">
    <title> professional Glassmorphism login </title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="email.css">
</head>

<body>
    <header>
    </header>
<section>
    <div class="login-box">
        <form id="loginform">
            <h2>LOGIN</h2>

            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="username" required>
                <label>Username</label>
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" required>
                <label>Password</label>
            </div>

            <button type="submit" class="login-btn" id="submitBtn">Sign In</button>
            
            <button type="reset" class="back-btn" href="index.html">BACK</button>

            <p class="signup-link">
                dont have account? <a href="#">create account</a>
            </p>
        </form>
    </div>
</section>
    <script src="script.js"></script>
</body>
</html>
